<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MegaPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand">MegaPrep Admin Dashboard</span>
      <button class="btn btn-light btn-sm" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <section class="row g-3 mb-4" id="stats"></section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Add Student Result</h2>
        <form id="addResultForm" class="row g-2">
          <input class="form-control" name="student_id" placeholder="Student ID" required>
          <input class="form-control" name="batch_id" placeholder="Batch ID" required>
          <input class="form-control" name="exam_id" placeholder="Exam ID" required>
          <input class="form-control" name="physics" placeholder="Physics" required>
          <input class="form-control" name="chemistry" placeholder="Chemistry" required>
          <input class="form-control" name="math" placeholder="Math" required>
          <input class="form-control" name="biology_ict" placeholder="Biology/ICT">
          <input class="form-control" name="total_marks" placeholder="Total Marks" required>
          <input class="form-control" name="gpa_percentage" placeholder="GPA / Percentage" required>
          <input class="form-control" name="grade" placeholder="Grade" required>
          <input class="form-control" name="merit_position" placeholder="Merit Position">
          <select class="form-select" name="status" required><option>Pass</option><option>Fail</option></select>
          <button class="btn btn-success" type="submit">Save Result</button>
        </form>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Bulk Upload Results (Excel/CSV)</h2>
        <form id="uploadForm" class="d-flex gap-2">
          <input type="file" class="form-control" id="resultFile" accept=".xlsx,.xls,.csv" required>
          <button class="btn btn-primary" type="submit">Upload</button>
        </form>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between mb-2">
          <h2 class="h5">Result List</h2>
          <input id="searchRoll" class="form-control w-auto" placeholder="Search by roll">
        </div>
        <div class="table-responsive">
          <table class="table table-sm" id="resultTable">
            <thead><tr><th>ID</th><th>Name</th><th>Roll</th><th>Batch</th><th>Exam</th><th>Total</th><th>GPA/%</th><th>Status</th><th>Action</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/admin.js"></script>
</body>
</html>
