<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - MegaPrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>MegaPrep Admin Dashboard</h2>
        <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="card stat-card p-3"><h6>Total Students</h6><h3 id="totalStudents">0</h3></div></div>
        <div class="col-md-4"><div class="card stat-card p-3"><h6>Total Results</h6><h3 id="totalResults">0</h3></div></div>
        <div class="col-md-4"><div class="card stat-card p-3"><h6>Pass Rate</h6><h3 id="passRate">0%</h3></div></div>
      </div>

      <div class="card p-4 mb-4">
        <h5>Add Student Result</h5>
        <form id="resultForm" class="row g-2">
          <input class="form-control" type="number" id="studentId" placeholder="Student ID" required />
          <input class="form-control" type="number" id="examId" placeholder="Exam ID" required />
          <input class="form-control" type="number" id="batchId" placeholder="Batch ID" required />
          <input class="form-control" type="number" id="totalMarks" placeholder="Total Marks" required />
          <input class="form-control" type="number" id="gpa" placeholder="GPA" step="0.01" />
          <select id="status" class="form-select" required>
            <option value="Pass">Pass</option>
            <option value="Fail">Fail</option>
          </select>
          <button class="btn btn-success">Save Result</button>
        </form>
      </div>

      <div class="card p-4">
        <h5>Bulk Upload CSV</h5>
        <form id="uploadForm" class="d-flex gap-2">
          <input type="file" id="csvFile" class="form-control" accept=".csv" required />
          <button class="btn btn-primary">Upload</button>
        </form>
      </div>
    </div>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
