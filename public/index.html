<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaPrep Result Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="hero-header py-4 mb-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div>
          <h2 class="mb-0">MegaPrep Coaching Center</h2>
          <p class="mb-0">Online Result System</p>
        </div>
        <img src="https://dummyimage.com/120x50/ffffff/0d6efd&text=MegaPrep" alt="MegaPrep Logo" class="rounded mt-3 mt-md-0" />
      </div>
    </header>

    <main class="container pb-5">
      <section class="card notice-card p-4 mb-4">
        <h5>Notice Board</h5>
        <ul class="mb-0">
          <li>HSC 2026 Model Test Result will be published every Friday.</li>
          <li>Final Exam Result Publish Date: 25 December 2026.</li>
        </ul>
      </section>

      <section class="card search-card p-4 mb-4">
        <h4 class="mb-3 text-center">Search Your Result</h4>
        <form id="resultForm" class="row g-3 justify-content-center">
          <div class="col-md-4">
            <label class="form-label">Roll / Registration Number</label>
            <input id="roll" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Batch</label>
            <select id="batch" class="form-select" required></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Exam</label>
            <select id="exam" class="form-select" required></select>
          </div>
          <div class="col-md-2 d-grid align-items-end">
            <button class="btn btn-success mt-4" type="submit">View Result</button>
          </div>
        </form>
      </section>

      <section id="resultSection" class="card result-card p-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Student Result</h4>
          <button onclick="window.print()" class="btn btn-outline-primary btn-sm">Print Result</button>
        </div>
        <div id="resultContent"></div>
      </section>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <footer class="footer py-3">
      <div class="container text-center">
        Contact: +8801XXXXXXXXX | Address: Dhaka, Bangladesh | Facebook: fb.com/megaprep
      </div>
    </footer>

    <script src="/js/main.js"></script>
  </body>
</html>
